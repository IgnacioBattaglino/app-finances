name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres real para los *Sql.test.js: sin él se saltean en silencio.
    # Supabase corre 15+; los tests usan PG* del entorno (psql, createdb).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Falla acá, fuerte, si no hay psql o el servicio no levantó: los tests
      # harían el mismo chequeo y se saltearían sin avisar.
      - run: pg_isready && psql --version
      - run: npm test
